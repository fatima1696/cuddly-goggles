name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 xvfb
      - name: Install dependencies
        run: npm install
      - name: Render the video
        run: xvfb-run -a npm run build
      - name: Upload the MP4
        uses: actions/upload-artifact@v4
        with:
          name: oil-puddle-rainbow
          path: out/oil-puddle-rainbow.mp4

